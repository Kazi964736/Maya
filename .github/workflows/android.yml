# Backup builder: makes Maya's APKs on GitHub (Actions tab -> "Build Maya APK" -> Run workflow).
name: Build Maya APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the Android project files
        run: |
          flutter create --org com.mayaai --platforms android --project-name maya .
          rm -f test/widget_test.dart
      - name: Set up desugaring and release keep-rules
        run: python3 tool/prepare_android.py
      - name: Get packages
        run: flutter pub get
      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run the command-understanding tests
        run: flutter test
        continue-on-error: true
      - name: Build the APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Upload the phone APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
